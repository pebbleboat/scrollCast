# Playwright + video recording needs Standard (1 CPU / 2GB RAM).
# Free tier (512MB) will OOM, hang, or take 5+ minutes — upgrade in the dashboard.
services:
  - type: web
    name: scrollcast
    runtime: node
    plan: standard
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: "0"
